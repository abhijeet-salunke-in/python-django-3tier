apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-frontend
  namespace: django-three-tier
spec:
  replicas: 2
  selector:
    matchLabels:
      app: django-frontend
  template:
    metadata:
      labels:
        app: django-frontend
    spec:
      containers:
        - name: nginx
          image: abhisalunke16/python-django-frontend:v1
          ports:
            - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: django-frontend
  namespace: django-three-tier
spec:
  type: NodePort
  selector:
    app: django-frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
